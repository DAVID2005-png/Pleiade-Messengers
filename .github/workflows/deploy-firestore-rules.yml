name: Deploy Firestore rules

on:
  push:
    branches:
      - main
      - master
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLEIADE_TECH_2185E }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global firebase-tools
      - run: firebase deploy --only firestore --project pleiade-tech-2185e --non-interactive
